<!DOCTYPE html>
<html>
  <head>
    <title>Hello</title>
    <link rel="stylesheet" href="style.css?v=6" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <nav class="page-nav" aria-label="Pages">
      <button
        type="button"
        class="nav-button active"
        data-page="cats"
        aria-pressed="true"
      >
        Cats
      </button>
      <button
        type="button"
        class="nav-button"
        data-page="dogs"
        aria-pressed="false"
      >
        Dogs
      </button>
      <button
        type="button"
        class="nav-button"
        data-page="chuck"
        aria-pressed="false"
      >
        Chuck Norris
      </button>
      <button
        type="button"
        class="nav-button"
        data-page="weather"
        aria-pressed="false"
      >
        Weather
      </button>
      <button
        type="button"
        class="nav-button"
        data-page="quiz"
        aria-pressed="false"
      >
        Mini Quiz
      </button>
    </nav>

    <section id="cats-page" class="page active">
      <h1>I am space golem! And I like pie!</h1>
      <div class="pet-generator">
        <img
          src="https://cataas.com/cat"
          alt="A cute cat"
          id="cat-image"
          class="pet-image"
        />
        <div class="pet-actions">
          <button id="new-cat-button" type="button">Show another cat</button>
        </div>
      </div>
    </section>

    <section id="dogs-page" class="page" hidden>
      <h1>Random dog generator</h1>
      <div class="pet-generator">
        <img
          alt="A cute dog"
          id="dog-image"
          class="pet-image"
          hidden
        />
        <div class="pet-actions">
          <button id="new-dog-button" type="button">Show another dog</button>
        </div>
      </div>
    </section>

    <section id="chuck-page" class="page" hidden>
      <h1>Chuck Norris quote</h1>
      <blockquote id="chuck-quote" class="chuck-quote">Loading...</blockquote>
      <button id="refresh-chuck-button" type="button">Another quote</button>
    </section>

    <section id="weather-page" class="page" hidden>
      <h1>Weather in Riga</h1>
      <div id="weather-card" class="weather-card" aria-live="polite">
        Loading weather...
      </div>
      <button id="refresh-weather-button" type="button">Refresh weather</button>
    </section>

    <section id="quiz-page" class="page" hidden>
      <h1>Famous painting mini-quiz</h1>
      <div class="quiz-card">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Mona_Lisa.jpg"
          alt="Famous painting quiz artwork"
          id="quiz-painting"
          class="quiz-painting"
        />
        <p class="quiz-question">Which famous painting is shown here?</p>
        <div class="quiz-options" aria-label="Painting answer options">
          <button type="button" class="quiz-option">
            The Starry Night
          </button>
          <button type="button" class="quiz-option">
            Mona Lisa
          </button>
          <button type="button" class="quiz-option">
            Girl with a Pearl Earring
          </button>
          <button type="button" class="quiz-option">
            The Scream
          </button>
        </div>
        <p id="quiz-result" class="quiz-result" aria-live="polite"></p>
      </div>
    </section>

    <script>
      const navButtons = document.querySelectorAll(".nav-button");
      const pages = document.querySelectorAll(".page");

      navButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const pageName = button.dataset.page;

          navButtons.forEach((navButton) => {
            const isActive = navButton === button;
            navButton.classList.toggle("active", isActive);
            navButton.setAttribute("aria-pressed", String(isActive));
          });

          pages.forEach((page) => {
            const isActive = page.id === `${pageName}-page`;
            page.classList.toggle("active", isActive);
            page.hidden = !isActive;
          });
        });
      });

      const catImage = document.getElementById("cat-image");
      const newCatButton = document.getElementById("new-cat-button");

      newCatButton.addEventListener("click", () => {
        catImage.src = `https://cataas.com/cat?${Date.now()}`;
      });

      const dogImage = document.getElementById("dog-image");
      const newDogButton = document.getElementById("new-dog-button");

      async function loadDogImage() {
        newDogButton.textContent = "Loading dog...";
        newDogButton.disabled = true;

        try {
          const response = await fetch("https://dog.ceo/api/breeds/image/random");
          if (!response.ok) throw new Error();

          const data = await response.json();
          dogImage.src = data.message;
          dogImage.alt = "A cute dog";
          dogImage.hidden = false;
        } catch {
          dogImage.hidden = true;
          dogImage.removeAttribute("src");
          dogImage.alt = "Could not load a dog";
        } finally {
          newDogButton.textContent = "Show another dog";
          newDogButton.disabled = false;
        }
      }

      newDogButton.addEventListener("click", loadDogImage);
      loadDogImage();

      const chuckQuote = document.getElementById("chuck-quote");
      const refreshChuckButton = document.getElementById("refresh-chuck-button");

      function toAsciiText(value) {
        return String(value)
          .normalize("NFKD")
          .replace(/[\u2018\u2019\u201A\u201B]/g, "'")
          .replace(/[\u201C\u201D\u201E\u201F]/g, '"')
          .replace(/[\u2013\u2014]/g, "-")
          .replace(/\u2026/g, "...")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^\x20-\x7E]/g, "");
      }

      async function loadChuckQuote() {
        chuckQuote.textContent = "Loading...";

        try {
          const response = await fetch("https://api.chucknorris.io/jokes/random");
          if (!response.ok) throw new Error();

          const data = await response.json();
          chuckQuote.textContent = `"${toAsciiText(data.value)}"`;
        } catch {
          chuckQuote.textContent = "Could not load a quote.";
        }
      }

      refreshChuckButton.addEventListener("click", loadChuckQuote);
      loadChuckQuote();

      const weatherCard = document.getElementById("weather-card");
      const refreshWeatherButton = document.getElementById("refresh-weather-button");
      const rigaWeatherUrl =
        "https://api.open-meteo.com/v1/forecast?latitude=56.9496&longitude=24.1052&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Europe%2FRiga";
      const weatherDescriptions = {
        0: "Clear sky",
        1: "Mainly clear",
        2: "Partly cloudy",
        3: "Overcast",
        45: "Fog",
        48: "Depositing rime fog",
        51: "Light drizzle",
        53: "Moderate drizzle",
        55: "Dense drizzle",
        61: "Slight rain",
        63: "Moderate rain",
        65: "Heavy rain",
        71: "Slight snow",
        73: "Moderate snow",
        75: "Heavy snow",
        80: "Slight rain showers",
        81: "Moderate rain showers",
        82: "Violent rain showers",
        95: "Thunderstorm",
        96: "Thunderstorm with slight hail",
        99: "Thunderstorm with heavy hail",
      };

      function formatWeatherValue(value, unit = "") {
        return `${value} ${unit}`.trim();
      }

      function getWeatherDescription(code) {
        return weatherDescriptions[code] || `Weather code ${code}`;
      }

      function createWeatherDetail(label, value) {
        const item = document.createElement("div");
        item.className = "weather-detail";

        const term = document.createElement("dt");
        term.textContent = label;

        const description = document.createElement("dd");
        description.textContent = value;

        item.append(term, description);
        return item;
      }

      function renderRigaWeather(current, units) {
        const summary = document.createElement("p");
        summary.className = "weather-summary";
        summary.textContent = getWeatherDescription(current.weather_code);

        const details = document.createElement("dl");
        details.className = "weather-details";
        details.append(
          createWeatherDetail(
            "Temperature",
            formatWeatherValue(current.temperature_2m, units.temperature_2m),
          ),
          createWeatherDetail(
            "Feels like",
            formatWeatherValue(
              current.apparent_temperature,
              units.apparent_temperature,
            ),
          ),
          createWeatherDetail(
            "Humidity",
            formatWeatherValue(
              current.relative_humidity_2m,
              units.relative_humidity_2m,
            ),
          ),
          createWeatherDetail(
            "Wind",
            formatWeatherValue(current.wind_speed_10m, units.wind_speed_10m),
          ),
        );

        weatherCard.replaceChildren(summary, details);
      }

      async function loadRigaWeather() {
        weatherCard.textContent = "Loading weather...";
        refreshWeatherButton.disabled = true;

        try {
          const response = await fetch(rigaWeatherUrl);
          if (!response.ok) throw new Error();

          const data = await response.json();
          if (!data.current) throw new Error();

          renderRigaWeather(data.current, data.current_units || {});
        } catch {
          weatherCard.textContent = "Could not load Riga weather.";
        } finally {
          refreshWeatherButton.disabled = false;
        }
      }

      refreshWeatherButton.addEventListener("click", loadRigaWeather);
      loadRigaWeather();

      const quizPainting = document.getElementById("quiz-painting");
      const quizOptions = Array.from(document.querySelectorAll(".quiz-option"));
      const quizResult = document.getElementById("quiz-result");
      const quizPaintings = [
        {
          title: "Mona Lisa",
          image:
            "https://upload.wikimedia.org/wikipedia/commons/6/6a/Mona_Lisa.jpg",
        },
        {
          title: "The Starry Night",
          image:
            "https://upload.wikimedia.org/wikipedia/commons/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg",
        },
        {
          title: "Girl with a Pearl Earring",
          image:
            "https://upload.wikimedia.org/wikipedia/commons/d/d7/Meisje_met_de_parel.jpg",
        },
        {
          title: "The Scream",
          image:
            "https://upload.wikimedia.org/wikipedia/commons/f/f4/The_Scream.jpg",
        },
        {
          title: "The Great Wave off Kanagawa",
          image:
            "https://upload.wikimedia.org/wikipedia/commons/0/0a/The_Great_Wave_off_Kanagawa.jpg",
        },
        {
          title: "American Gothic",
          image:
            "https://upload.wikimedia.org/wikipedia/commons/c/cc/Grant_Wood_-_American_Gothic_-_Google_Art_Project.jpg",
        },
      ];
      let currentQuizPainting = null;
      let quizRerollTimer = null;
      let quizQuestionId = 0;

      function getRandomItem(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function shuffleItems(items) {
        const shuffled = [...items];

        for (let index = shuffled.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [shuffled[index], shuffled[randomIndex]] = [
            shuffled[randomIndex],
            shuffled[index],
          ];
        }

        return shuffled;
      }

      function getNextQuizPainting() {
        if (quizPaintings.length === 1) return quizPaintings[0];

        let nextPainting = getRandomItem(quizPaintings);

        while (nextPainting === currentQuizPainting) {
          nextPainting = getRandomItem(quizPaintings);
        }

        return nextPainting;
      }

      function setQuizOptionsEnabled(enabled) {
        quizOptions.forEach((option) => {
          option.disabled = !enabled;
        });
      }

      function loadQuizPaintingImage(painting, questionId) {
        quizPainting.classList.add("is-loading");
        quizPainting.alt = "Loading painting...";
        setQuizOptionsEnabled(false);

        quizPainting.onload = () => {
          if (questionId !== quizQuestionId) return;

          quizPainting.classList.remove("is-loading");
          quizPainting.alt = `Painting: ${painting.title}`;
          setQuizOptionsEnabled(true);
        };

        quizPainting.onerror = () => {
          if (questionId !== quizQuestionId) return;

          quizPainting.classList.remove("is-loading");
          quizPainting.alt = "Could not load painting";
          setQuizOptionsEnabled(true);
        };

        // Do not append ?q= — Wikimedia returns 400 for unknown query params on many URLs.
        if (quizPainting.getAttribute("src")) {
          quizPainting.removeAttribute("src");
        }
        quizPainting.src = painting.image;
      }

      function renderQuizQuestion() {
        clearTimeout(quizRerollTimer);
        quizQuestionId += 1;
        const questionId = quizQuestionId;

        const nextPainting = getNextQuizPainting();
        const distractors = shuffleItems(
          quizPaintings.filter((painting) => painting !== nextPainting),
        ).slice(0, quizOptions.length - 1);
        const answers = shuffleItems([nextPainting, ...distractors]);

        currentQuizPainting = nextPainting;

        quizOptions.forEach((option, index) => {
          const answer = answers[index];

          option.textContent = answer.title;
          option.dataset.correct = String(answer === nextPainting);
          option.classList.remove("selected");
        });

        quizResult.className = "quiz-result";
        quizResult.textContent = "";

        loadQuizPaintingImage(nextPainting, questionId);
      }

      quizOptions.forEach((option) => {
        option.addEventListener("click", () => {
          const isCorrect = option.dataset.correct === "true";

          quizOptions.forEach((quizOption) => {
            quizOption.classList.toggle("selected", quizOption === option);
          });

          quizResult.className = `quiz-result ${isCorrect ? "success" : "error"}`;
          quizResult.textContent = isCorrect
            ? "Congratulations, customer! You selected correctly."
            : "Not quite. Try another option.";

          if (isCorrect) {
            quizOptions.forEach((quizOption) => {
              quizOption.disabled = true;
            });

            quizRerollTimer = setTimeout(renderQuizQuestion, 1200);
          }
        });
      });

      renderQuizQuestion();
    </script>
  </body>
</html>
